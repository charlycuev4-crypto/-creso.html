<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CRESO — Accesorios &amp; Mayorista Directo</title>
    <style>
        :root {
            /* SELLO DE MARCA CRESO */
            --brand-primary: #059669;
            --brand-primary-dark: #047857;
            --brand-primary-deeper: #064e3b;
            --brand-primary-soft: #ecfdf5;
            --brand-tech: #0284c7;
            --brand-accent: #f59e0b;
            --brand-gold-light: #fbbf24;
            --brand-accent-soft: #fffbeb;

            --bg-page: #eef6f2;
            --bg-card: #ffffff;
            --bg-muted: #f8fafc;
            --text-main: #0f172a;
            --text-secondary: #475569;
            --border-light: #cbd5e1;
            --border-brand: rgba(5, 150, 105, 0.35);
            --border-card-green: #047857;
            --shadow-card: 0 4px 16px rgba(4, 120, 87, 0.08);
            --shadow-hover: 0 10px 26px rgba(4, 120, 87, 0.18);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background-color: var(--bg-page);
            color: var(--text-main);
            line-height: 1.45;
            overflow-x: hidden;
            padding-bottom: 110px;
        }

        /* ========== TOAST NOTIFICATION ========== */
        .toast-container {
            position: fixed;
            top: 16px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 9999;
            display: flex;
            flex-direction: column;
            gap: 8px;
            pointer-events: none;
            width: 92%;
            max-width: 410px;
        }

        .toast {
            background: linear-gradient(135deg, var(--brand-primary-dark) 0%, var(--brand-primary) 100%);
            color: #ffffff;
            padding: 12px 16px;
            border-radius: 14px;
            font-weight: 700;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            gap: 10px;
            box-shadow: 0 10px 25px rgba(5, 150, 105, 0.35);
            transform: translateY(-100px);
            opacity: 0;
            transition: all 0.38s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            pointer-events: auto;
        }

        .toast.show { transform: translateY(0); opacity: 1; }
        .toast-icon { font-size: 1.25rem; }
        .toast-text { flex: 1; }
        .toast-close {
            background: rgba(255, 255, 255, 0.22);
            border: none;
            color: #ffffff;
            width: 24px;
            height: 24px;
            border-radius: 50%;
            cursor: pointer;
            font-weight: 800;
        }

        /* ========== HEADER SUPERIOR VERDE CON CARRUSEL ARRIBA ========== */
        .topbar {
            background: linear-gradient(160deg, var(--brand-primary-deeper) 0%, var(--brand-primary-dark) 55%, var(--brand-primary) 100%);
            color: #ffffff;
            padding: 14px 16px 20px;
            border-bottom: 3px solid var(--brand-accent);
            box-shadow: 0 6px 20px rgba(6, 78, 59, 0.2);
        }

        .topbar-inner {
            max-width: 1200px;
            margin: 0 auto;
        }

        .brand-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            margin-bottom: 12px;
        }

        .brand-identity {
            display: flex;
            align-items: baseline;
            gap: 10px;
            flex-wrap: wrap;
        }

        .logo {
            font-size: 2.05rem;
            font-weight: 900;
            letter-spacing: 4px;
            color: var(--brand-gold-light);
            display: inline-flex;
            align-items: center;
            gap: 7px;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.28);
        }

        .logo-dot {
            width: 11px;
            height: 11px;
            border-radius: 50%;
            background: var(--brand-gold-light);
            display: inline-block;
            box-shadow: 0 0 10px rgba(251, 191, 36, 0.85);
        }

        .lema {
            font-size: 0.86rem;
            color: #d1fae5;
            font-weight: 600;
        }

        .top-controls {
            display: flex;
            gap: 8px;
            flex-shrink: 0;
        }

        .icon-btn {
            background: rgba(255, 255, 255, 0.14);
            border: 1px solid rgba(255, 255, 255, 0.32);
            color: #ffffff;
            width: 38px;
            height: 38px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 1.05rem;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }

        .icon-btn.active-sound {
            background: rgba(16, 185, 129, 0.35);
            border-color: #a7f3d0;
        }

        /* CARRUSEL / RULETA ARRIBA DE TODO CON FOTO LIMPIA ADENTRO */
        .hero-carousel {
            position: relative;
            border-radius: 18px;
            overflow: hidden;
            box-shadow: 0 10px 26px rgba(0, 0, 0, 0.28);
            border: 2px solid rgba(251, 191, 36, 0.72);
            background: #022c22;
            user-select: none;
            margin-bottom: 14px;
        }

        .hero-slides {
            display: flex;
            transition: transform 0.5s cubic-bezier(0.22, 1, 0.36, 1);
            will-change: transform;
        }

        .hero-slide {
            min-width: 100%;
            min-height: 245px;
            position: relative;
            overflow: hidden;
        }

        /* Cuadro con la foto limpia sin títulos encima */
        .slide-full-photo {
            padding: 0;
            background: #022c22;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .slide-full-photo img {
            width: 100%;
            height: 260px;
            object-fit: cover;
            object-position: center 15%;
            display: block;
        }

        .slide-corner-brand {
            position: absolute;
            top: 12px;
            left: 52px;
            background: rgba(2, 44, 34, 0.72);
            color: var(--brand-gold-light);
            border: 1px solid rgba(251, 191, 36, 0.6);
            padding: 3px 12px;
            border-radius: 999px;
            font-size: 0.78rem;
            font-weight: 900;
            letter-spacing: 3px;
            z-index: 3;
        }

        .slide-offer-style {
            padding: 26px 48px 44px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
            color: #ffffff;
        }

        .slide-offer-1 {
            background: radial-gradient(circle at 85% 25%, rgba(251, 191, 36, 0.22), transparent 48%),
                        linear-gradient(125deg, #022c22 0%, #047857 52%, #059669 100%);
        }

        .slide-offer-2 {
            background: radial-gradient(circle at 85% 75%, rgba(56, 189, 248, 0.22), transparent 50%),
                        linear-gradient(125deg, #064e3b 0%, #047857 55%, #0f766e 100%);
        }

        /* Cierre final: nombre CRESO en dorado sobre fondo verde */
        .slide-brand-gold {
            padding: 26px 48px 44px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            background: radial-gradient(circle at 50% 30%, rgba(251, 191, 36, 0.28) 0%, transparent 58%),
                        linear-gradient(135deg, #022c22 0%, #064e3b 52%, #047857 100%);
        }

        .slide-content {
            max-width: 680px;
            z-index: 2;
        }

        .slide-kicker {
            display: inline-block;
            font-size: 0.72rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            background: rgba(251, 191, 36, 0.22);
            color: var(--brand-gold-light);
            border: 1px solid rgba(251, 191, 36, 0.55);
            padding: 2px 11px;
            border-radius: 999px;
            margin-bottom: 7px;
        }

        .slide-title {
            font-size: 1.48rem;
            font-weight: 900;
            line-height: 1.18;
            margin-bottom: 6px;
            color: #ffffff;
        }

        .slide-sub {
            font-size: 0.92rem;
            color: #d1fae5;
            font-weight: 600;
        }

        .slide-brand-showcase {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
        }

        .slide-brand-name {
            font-size: 2.85rem;
            font-weight: 900;
            letter-spacing: 8px;
            text-transform: uppercase;
            color: var(--brand-gold-light);
            text-shadow: 0 4px 18px rgba(0, 0, 0, 0.45);
            line-height: 1.05;
        }

        .slide-brand-tag {
            font-size: 0.92rem;
            letter-spacing: 1.2px;
            color: #fef3c7;
            font-weight: 800;
        }

        .slide-visual-badge {
            font-size: 3.3rem;
            opacity: 0.96;
            flex-shrink: 0;
            filter: drop-shadow(0 8px 14px rgba(0, 0, 0, 0.28));
        }

        .carousel-arrow {
            position: absolute;
            top: 50%;
            transform: translateY(-65%);
            background: rgba(2, 44, 34, 0.65);
            color: var(--brand-gold-light);
            border: 1px solid rgba(251, 191, 36, 0.55);
            width: 34px;
            height: 34px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 1.15rem;
            font-weight: 900;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 5;
        }

        .carousel-arrow.prev { left: 10px; }
        .carousel-arrow.next { right: 10px; }

        .carousel-dots {
            position: absolute;
            bottom: 10px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 8px;
            z-index: 6;
            background: rgba(2, 44, 34, 0.62);
            padding: 5px 12px;
            border-radius: 999px;
        }

        .carousel-dot {
            width: 9px;
            height: 9px;
            border-radius: 50%;
            border: none;
            background: rgba(255, 255, 255, 0.45);
            cursor: pointer;
            transition: all 0.25s;
        }

        .carousel-dot.active {
            width: 22px;
            border-radius: 999px;
            background: var(--brand-gold-light);
        }

        /* BOTONES INFERIORES DEL HEADER */
        .info-strip {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .info-chip {
            font-size: 0.84rem;
            font-weight: 800;
            padding: 10px 12px;
            border-radius: 11px;
            text-align: center;
            text-decoration: none;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .info-chip.tech {
            background: #0284c7;
            color: #ffffff;
            border: 1px solid #7dd3fc;
            box-shadow: 0 4px 12px rgba(2, 132, 199, 0.32);
        }

        .info-chip.gold {
            background: var(--brand-accent);
            color: #0f172a;
            border: 1px solid #fde68a;
            box-shadow: 0 4px 12px rgba(245, 158, 11, 0.25);
        }

        /* ========== BUSCADOR Y CATEGORÍAS STICKY ========== */
        .sticky-bar {
            position: sticky;
            top: 0;
            z-index: 100;
            background: rgba(255, 255, 255, 0.97);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--border-light);
            padding: 10px 16px;
            box-shadow: 0 2px 10px rgba(15, 23, 42, 0.05);
        }

        .sticky-inner {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .search-row {
            display: flex;
            gap: 8px;
        }

        .search-box {
            position: relative;
            flex: 1;
        }

        .search-box input {
            width: 100%;
            background: var(--bg-muted);
            border: 1px solid var(--border-light);
            color: var(--text-main);
            padding: 10px 14px 10px 38px;
            border-radius: 12px;
            font-size: 0.92rem;
            transition: border-color 0.2s, background 0.2s;
        }

        .search-box input:focus {
            outline: none;
            background: #ffffff;
            border-color: var(--brand-primary);
            box-shadow: 0 0 0 3px rgba(5, 150, 105, 0.14);
        }

        .search-icon {
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-secondary);
            font-size: 0.95rem;
        }

        .sort-select {
            background: var(--bg-muted);
            border: 1px solid var(--border-light);
            color: var(--text-main);
            padding: 0 12px;
            border-radius: 12px;
            font-size: 0.84rem;
            font-weight: 700;
            cursor: pointer;
        }

        .tabs {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            scrollbar-width: none;
        }

        .tabs::-webkit-scrollbar { display: none; }

        .tab {
            background: var(--bg-muted);
            border: 1px solid var(--border-light);
            color: var(--text-secondary);
            padding: 7px 15px;
            border-radius: 999px;
            cursor: pointer;
            font-weight: 700;
            font-size: 0.84rem;
            white-space: nowrap;
            transition: all 0.2s;
        }

        .tab.active {
            background: var(--brand-primary);
            color: #ffffff;
            border-color: var(--brand-primary);
        }

        /* ========== GRID DE PRODUCTOS (CUADRO COMPLETO CON BORDE VERDE) ========== */
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 16px;
        }

        .section-heading {
            display: flex;
            align-items: baseline;
            justify-content: space-between;
            margin-bottom: 12px;
            gap: 8px;
            flex-wrap: wrap;
        }

        .section-heading h2 {
            font-size: 1.2rem;
            font-weight: 900;
            color: var(--brand-primary-deeper);
        }

        .section-heading span {
            font-size: 0.82rem;
            color: var(--brand-primary-dark);
            font-weight: 700;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 16px;
        }

        .card {
            background: var(--bg-card);
            border: 2.5px solid var(--border-card-green);
            border-radius: 16px;
            padding: 11px;
            display: flex;
            flex-direction: column;
            position: relative;
            box-shadow: var(--shadow-card);
            transition: transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease;
        }

        .card:hover {
            transform: translateY(-3px);
            box-shadow: var(--shadow-hover);
            border-color: var(--brand-primary-deeper);
        }

        .card.added-anim { animation: cardPop 0.45s ease; }

        @keyframes cardPop {
            0% { transform: scale(1); }
            45% { transform: scale(1.02); border-color: var(--brand-accent); }
            100% { transform: scale(1); }
        }

        .badge {
            position: absolute;
            top: 19px;
            left: 19px;
            background: var(--brand-primary-dark);
            color: #ffffff;
            padding: 4px 9px;
            border-radius: 7px;
            font-size: 0.7rem;
            font-weight: 800;
            z-index: 5;
            letter-spacing: 0.3px;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.16);
        }

        .badge.gold-badge {
            background: var(--brand-accent);
            color: #0f172a;
        }

        .card-visual {
            width: 100%;
            height: 162px;
            background: linear-gradient(180deg, #f0fdf4 0%, #dcfce7 100%);
            border: 2px solid var(--border-card-green);
            border-radius: 11px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }

        .card-visual img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .card-visual svg {
            width: 82%;
            height: 82%;
        }

        .card-body {
            padding: 11px 2px 2px;
            display: flex;
            flex-direction: column;
            flex: 1;
        }

        .card-cat {
            font-size: 0.68rem;
            text-transform: uppercase;
            font-weight: 800;
            letter-spacing: 1px;
            color: var(--brand-tech);
            margin-bottom: 3px;
        }

        .card-title {
            font-size: 1.02rem;
            font-weight: 800;
            color: var(--text-main);
            margin-bottom: 4px;
        }

        .card-desc {
            font-size: 0.82rem;
            color: var(--text-secondary);
            margin-bottom: 12px;
            flex: 1;
        }

        .price-row {
            display: flex;
            align-items: baseline;
            justify-content: space-between;
            gap: 8px;
            margin-bottom: 8px;
        }

        .price-main {
            font-size: 1.32rem;
            font-weight: 900;
            color: var(--text-main);
        }

        .price-wholesale {
            font-size: 0.78rem;
            font-weight: 800;
            color: var(--brand-primary-dark);
            background: var(--brand-primary-soft);
            padding: 3px 8px;
            border-radius: 6px;
            border: 1px solid var(--border-brand);
        }

        .progress-mini {
            margin-bottom: 10px;
        }

        .progress-label {
            display: flex;
            justify-content: space-between;
            font-size: 0.73rem;
            color: var(--text-secondary);
            font-weight: 700;
            margin-bottom: 4px;
        }

        .progress-label.done { color: var(--brand-primary-dark); }

        .bar-bg {
            height: 5px;
            background: #e2e8f0;
            border-radius: 999px;
            overflow: hidden;
        }

        .bar-fill {
            height: 100%;
            background: var(--brand-primary);
            border-radius: 999px;
            transition: width 0.25s ease;
        }

        .card-actions {
            display: grid;
            grid-template-columns: 1fr auto;
            gap: 6px;
        }

        .btn-add {
            background: var(--brand-primary-dark);
            color: #ffffff;
            border: none;
            padding: 10px 12px;
            border-radius: 10px;
            font-weight: 800;
            font-size: 0.86rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
            transition: background 0.2s, transform 0.15s;
        }

        .btn-add:hover { background: var(--brand-primary-deeper); }
        .btn-add:active { transform: scale(0.97); }
        .btn-add.added { background: var(--brand-tech); }

        .btn-pack {
            background: var(--brand-accent-soft);
            color: #b45309;
            border: 1px solid rgba(245, 158, 11, 0.55);
            padding: 10px 10px;
            border-radius: 10px;
            font-size: 0.78rem;
            font-weight: 800;
            cursor: pointer;
            white-space: nowrap;
        }

        /* ========== BOTÓN FLOTANTE CARRITO (FAB) ========== */
        .cart-fab {
            position: fixed;
            bottom: 22px;
            right: 20px;
            z-index: 1000;
            background: linear-gradient(135deg, var(--brand-primary-dark) 0%, var(--brand-primary) 100%);
            color: #ffffff;
            width: 64px;
            height: 64px;
            border-radius: 50%;
            border: 2px solid #ffffff;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.6rem;
            box-shadow: 0 8px 24px rgba(5, 150, 105, 0.42);
            transition: transform 0.2s;
        }

        .cart-fab:active { transform: scale(0.92); }
        .cart-fab.bounce { animation: fabBounce 0.55s ease; }

        @keyframes fabBounce {
            0%, 100% { transform: scale(1); }
            30% { transform: scale(1.2); }
            55% { transform: scale(0.94); }
            75% { transform: scale(1.08); }
        }

        .cart-fab-badge {
            position: absolute;
            top: -4px;
            right: -4px;
            background: var(--brand-accent);
            color: #0f172a;
            min-width: 24px;
            height: 24px;
            border-radius: 50%;
            font-size: 0.75rem;
            font-weight: 900;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 2px solid #ffffff;
        }

        .cart-fab-badge.pop { animation: badgeScale 0.35s ease; }

        @keyframes badgeScale {
            0% { transform: scale(1); }
            50% { transform: scale(1.5); }
            100% { transform: scale(1); }
        }

        .cart-fab-total {
            position: absolute;
            bottom: -10px;
            left: 50%;
            transform: translateX(-50%);
            background: #ffffff;
            color: var(--brand-primary-dark);
            padding: 2px 9px;
            border-radius: 999px;
            font-size: 0.7rem;
            font-weight: 900;
            white-space: nowrap;
            border: 1px solid var(--brand-primary);
            box-shadow: 0 2px 8px rgba(15, 23, 42, 0.12);
        }

        /* ========== DRAWER CARRITO & ADMIN ========== */
        .drawer-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(15, 23, 42, 0.52);
            backdrop-filter: blur(3px);
