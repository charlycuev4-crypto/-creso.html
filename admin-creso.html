<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin CRESO</title>
  <style>
    :root {
      --bg: #f4f7f5;
      --card: #ffffff;
      --primary: #157347;
      --primary-dark: #0f5635;
      --text: #1b2420;
      --muted: #5d6b64;
      --border: #d5e0da;
      --danger: #b42318;
    }
    * { box-sizing: border-box; font-family: system-ui, -apple-system, sans-serif; }
    body { margin: 0; background: var(--bg); color: var(--text); padding: 16px; }
    .container { max-width: 720px; margin: 0 auto; display: grid; gap: 16px; }
    .card { background: var(--card); border: 1.5px solid var(--border); border-radius: 14px; padding: 18px; }
    h1, h2 { margin: 0 0 12px; font-size: 1.2rem; }
    .topbar { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
    .topbar a { color: var(--primary); font-weight: 600; text-decoration: none; }
    label { display: block; font-size: 0.9rem; font-weight: 600; margin: 10px 0 6px; }
    input, select, textarea {
      width: 100%; padding: 10px 12px; border: 1px solid var(--border);
      border-radius: 10px; font-size: 0.95rem; background: #fff; color: var(--text);
    }
    textarea { min-height: 76px; resize: vertical; }
    .btn {
      margin-top: 14px; width: 100%; padding: 12px 16px; border: 0; border-radius: 10px;
      background: var(--primary); color: #fff; font-size: 1rem; font-weight: 700; cursor: pointer;
    }
    .btn:hover { background: var(--primary-dark); }
    .btn-sm {
      width: auto; margin-top: 0; padding: 7px 11px; font-size: 0.85rem;
      border-radius: 8px; background: #fee4e2; color: var(--danger); font-weight: 700; border: 0; cursor: pointer;
    }
    .status { margin-top: 10px; font-size: 0.9rem; font-weight: 600; }
    .ok { color: var(--primary); }
    .err { color: var(--danger); }
    .item {
      border-top: 1px solid var(--border); padding: 12px 0;
      display: flex; justify-content: space-between; align-items: center; gap: 12px;
    }
    .item:first-child { border-top: 0; }
    .meta { color: var(--muted); font-size: 0.88rem; margin-top: 4px; }
  </style>
</head>
<body>
  <div class="container">
    <div class="card topbar">
      <h1>Panel Admin · Tienda CRESO</h1>
      <a href="index.html">Ver tienda →</a>
    </div>

    <div class="card">
      <h2>+ Cargar artículo nuevo</h2>
      <form id="form-producto">
        <label for="nombre">Nombre del artículo *</label>
        <input id="nombre" name="nombre" type="text" required placeholder="Ej: Cargador Samsung Super Charger 45W PD" />

        <label for="categoria">Categoría *</label>
        <select id="categoria" name="categoria" required>
          <option value="Cargadores">Cargadores</option>
          <option value="Cables">Cables</option>
          <option value="Audio">Audio</option>
          <option value="Accesorios">Accesorios</option>
        </select>

        <label for="precio_unitario">Precio unitario ($) *</label>
        <input id="precio_unitario" name="precio_unitario" type="number" min="0" step="any" required placeholder="9000" />

        <label for="precio_mayorista">Precio mayorista 3+ unidades ($) *</label>
        <input id="precio_mayorista" name="precio_mayorista" type="number" min="0" step="any" required placeholder="7500" />

        <label for="badge">Etiqueta destacada (opcional)</label>
        <input id="badge" name="badge" type="text" placeholder="3+ MAYOR / 45W PD" />

        <label for="imagen_url">URL de imagen del producto (opcional)</label>
        <input id="imagen_url" name="imagen_url" type="url" placeholder="https://..." />

        <label for="descripcion">Descripción</label>
        <textarea id="descripcion" name="descripcion" placeholder="Detalles del producto..."></textarea>

        <button class="btn" type="submit">Publicar en la tienda CRESO</button>
        <div id="estado-form" class="status"></div>
      </form>
    </div>

    <div class="card">
      <h2>Artículos cargados en Supabase</h2>
      <div id="lista-productos" class="status">Conectando con Supabase...</div>
    </div>
  </div>

  <script type="module">
    import { createClient } from "https://esm.sh/@supabase/supabase-js@2";

    const SUPABASE_URL = "https://hinqiuvbwygqhbabvxrc.supabase.co";
    const SUPABASE_ANON_KEY = "Sb_publishable_bFgl6XvYSSray5OgNDlx4w_f5D8aN37";
    const TABLA = "creso_productos";

    const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const form = document.getElementById("form-producto");
    const estadoForm = document.getElementById("estado-form");
    const listaEl = document.getElementById("lista-productos");

    function formatoPesos(valor) {
      return new Intl.NumberFormat("es-AR", {
        style: "currency",
        currency: "ARS",
        maximumFractionDigits: 0
      }).format(Number(valor || 0));
    }

    async function cargarProductos() {
      listaEl.className = "status";
      listaEl.textContent = "Conectando con Supabase...";

      const { data, error } = await supabase
        .from(TABLA)
        .select("*")
        .order("id", { ascending: false });

      if (error) {
        listaEl.className = "status err";
        listaEl.textContent = "Error al cargar artículos: " + error.message;
        return;
      }

      if (!data || data.length === 0) {
        listaEl.className = "status";
        listaEl.textContent = "Todavía no hay artículos cargados en creso_productos.";
        return;
      }

      listaEl.className = "";
      listaEl.innerHTML = "";

      data.forEach((prod) => {
        const fila = document.createElement("div");
        fila.className = "item";
        fila.innerHTML = `
          <div>
            <strong>${prod.nombre}</strong>
            <div class="meta">
              ${prod.categoria} · Unitario: ${formatoPesos(prod.precio_unitario)} ·
              Mayorista (${prod.min_mayorista || 3}+ u.): ${formatoPesos(prod.precio_mayorista)}
            </div>
          </div>
          <button class="btn-sm" data-id="${prod.id}" type="button">Borrar</button>
        `;

        fila.querySelector("button").addEventListener("click", async () => {
          const { error: errBorrar } = await supabase.from(TABLA).delete().eq("id", prod.id);
          if (errBorrar) {
            alert("No se pudo borrar: " + errBorrar.message);
          } else {
            cargarProductos();
          }
        });

        listaEl.appendChild(fila);
      });
    }

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      estadoForm.className = "status";
      estadoForm.textContent = "Publicando artículo...";

      const fd = new FormData(form);
      const nuevoProducto = {
        nombre: String(fd.get("nombre") || "").trim(),
        categoria: String(fd.get("categoria") || "Accesorios").trim(),
        precio_unitario: Number(fd.get("precio_unitario") || 0),
        precio_mayorista: Number(fd.get("precio_mayorista") || 0),
        min_mayorista: 3,
        badge: String(fd.get("badge") || "").trim() || "3+ MAYOR",
        imagen_url: String(fd.get("imagen_url") || "").trim(),
        descripcion: String(fd.get("descripcion") || "").trim()
      };

      const { error } = await supabase.from(TABLA).insert([nuevoProducto]);

      if (error) {
        estadoForm.className = "status err";
        estadoForm.textContent = "Error al publicar: " + error.message;
        return;
      }

      form.reset();
      estadoForm.className = "status ok";
      estadoForm.textContent = "¡Artículo publicado en CRESO!";
      cargarProductos();
    });

    cargarProductos();
  </script>
</body>
</html>
