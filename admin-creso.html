<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Admin CRESO — Gestión de Productos</title>
    <style>
        :root {
            --brand-primary: #059669;
            --brand-dark: #047857;
            --brand-deeper: #064e3b;
            --brand-gold: #fbbf24;
            --bg-page: #eef6f2;
            --bg-card: #ffffff;
            --text-main: #0f172a;
            --text-muted: #475569;
            --border: #cbd5e1;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: var(--bg-page);
            color: var(--text-main);
            padding: 16px;
            padding-bottom: 50px;
        }
        .wrap { max-width: 820px; margin: 0 auto; }
        .header {
            background: linear-gradient(135deg, var(--brand-deeper), var(--brand-dark), var(--brand-primary));
            color: #fff;
            padding: 18px;
            border-radius: 16px;
            border-bottom: 3px solid #f59e0b;
            margin-bottom: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }
        .header h1 { font-size: 1.35rem; color: var(--brand-gold); letter-spacing: 1px; }
        .header p { font-size: 0.82rem; color: #d1fae5; margin-top: 2px; }
        .btn-store {
            background: rgba(255,255,255,0.16);
            color: #fff;
            text-decoration: none;
            padding: 9px 14px;
            border-radius: 10px;
            font-weight: 800;
            font-size: 0.85rem;
            border: 1px solid rgba(255,255,255,0.35);
        }
        .card {
            background: var(--bg-card);
            border: 2px solid var(--brand-dark);
            border-radius: 16px;
            padding: 16px;
            margin-bottom: 16px;
            box-shadow: 0 4px 14px rgba(4, 120, 87, 0.08);
        }
        .card h2 { font-size: 1.08rem; color: var(--brand-deeper); margin-bottom: 12px; }
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .full { grid-column: 1 / -1; }
        label { display: block; font-size: 0.78rem; font-weight: 700; color: var(--text-muted); margin-bottom: 4px; }
        input, select {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid var(--border);
            border-radius: 10px;
            font-size: 0.92rem;
            background: #f8fafc;
        }
        input:focus, select:focus { outline: none; border-color: var(--brand-primary); background: #fff; }
        .preview-box {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-top: 6px;
        }
        .preview-img {
            width: 64px;
            height: 64px;
            border-radius: 10px;
            object-fit: cover;
            border: 2px solid var(--brand-dark);
            background: #ecfdf5;
            display: none;
        }
        .btn {
            border: none;
            border-radius: 11px;
            padding: 12px 16px;
            font-weight: 800;
            cursor: pointer;
            font-size: 0.92rem;
        }
        .btn-save { background: var(--brand-dark); color: #fff; width: 100%; margin-top: 6px; }
        .btn-save:hover { background: var(--brand-deeper); }
        .btn-edit { background: #e0f2fe; color: #0369a1; padding: 7px 11px; font-size: 0.8rem; }
        .btn-del { background: #fee2e2; color: #b91c1c; padding: 7px 11px; font-size: 0.8rem; }
        .status { margin-top: 8px; font-size: 0.85rem; font-weight: 700; color: var(--brand-dark); }
        .prod-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            padding: 12px 0;
            border-bottom: 1px solid #e2e8f0;
            flex-wrap: wrap;
        }
        .prod-thumb {
            width: 58px;
            height: 58px;
            border-radius: 10px;
            object-fit: cover;
            border: 1.5px solid var(--brand-dark);
            background: #ecfdf5;
            flex-shrink: 0;
        }
        .prod-info { flex: 1; min-width: 190px; }
        .prod-meta { font-size: 0.8rem; color: var(--text-muted); font-weight: 700; margin-top: 2px; }
        .prod-actions { display: flex; gap: 6px; }
        @media (max-width: 560px) { .grid-2 { grid-template-columns: 1fr; } }
    </style>
</head>
<body>
<div class="wrap">
    <div class="header">
        <div>
            <h1>⚙️ ADMIN CRESO</h1>
            <p>Cargá artículos nuevos y se reflejan en vivo en la tienda</p>
        </div>
        <a class="btn-store" href="index.html">Ver tienda CRESO →</a>
    </div>

    <div class="card">
        <h2 id="formTitle">➕ Cargar artículo nuevo</h2>
        <input type="hidden" id="editId" value="">
        <div class="grid-2">
            <div>
                <label>Nombre del artículo *</label>
                <input type="text" id="nombre" placeholder="Ej: Proyector Mini HD / Gamepad / Reloj Android">
            </div>
            <div>
                <label>Categoría *</label>
                <select id="categoria">
                    <option value="cables">🔌 Cables</option>
                    <option value="cargadores">⚡ Cargadores</option>
                    <option value="audio">🎧 Audio</option>
                    <option value="proyectores">📽️ Proyectores</option>
                    <option value="relojes">⌚ Relojes Android</option>
                    <option value="accesorios">🎮 Celulares y Gadgets</option>
                </select>
            </div>
            <div>
                <label>Precio unitario ($) *</label>
                <input type="number" id="precioUnitario" placeholder="6500">
            </div>
            <div>
                <label>Precio mayorista 3+ ($) *</label>
                <input type="number" id="precioMayorista" placeholder="5200">
            </div>
            <div>
                <label>Etiqueta destacada (opcional)</label>
                <input type="text" id="badge" placeholder="Ej: NUEVO / HD / GAMEPAD">
            </div>
            <div>
                <label>Foto del producto</label>
                <input type="file" id="fotoFile" accept="image/*" onchange="procesarFoto(this)">
                <div class="preview-box">
                    <img id="fotoPreview" class="preview-img" alt="Vista previa">
                    <span id="fotoStatus" style="font-size:0.78rem; color:#475569;">Sin foto seleccionada</span>
                </div>
            </div>
            <div class="full">
                <label>Descripción</label>
                <input type="text" id="descripcion" placeholder="Características principales del producto...">
            </div>
        </div>
        <button class="btn btn-save" id="btnGuardar" onclick="guardarProducto()">💾 Publicar en la tienda CRESO</button>
        <button class="btn" id="btnCancelarEdicion" onclick="limpiarFormulario()" style="display:none; width:100%; margin-top:6px; background:#e2e8f0; color:#334155;">Cancelar edición</button>
        <div class="status" id="estado"></div>
    </div>

    <div class="card">
        <h2>📦 Artículos cargados en Supabase</h2>
        <div id="listaProductos">Conectando con Supabase...</div>
    </div>
</div>

<script type="module">
    import { createClient } from "https://esm.sh/@supabase/supabase-js@2";

    const SUPABASE_URL = "https://hinqiuvbwygqhbabvxrc.supabase.co";
    const SUPABASE_ANON_KEY = "Sb_publishable_bFgl6XvYSSray5OgNDlx4w_f5D8aN37";
    const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let fotoActualBase64 = "";
    let cacheProductos = [];

    window.procesarFoto = function(input) {
        const file = input.files && input.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = e => {
            const img = new Image();
            img.onload = () => {
                const canvas = document.createElement("canvas");
                const max = 560;
                let w = img.width, h = img.height;
                if (w > max || h > max) {
                    if (w > h) { h = Math.round(h * max / w); w = max; }
                    else { w = Math.round(w * max / h); h = max; }
                }
                canvas.width = w;
                canvas.height = h;
                canvas.getContext("2d").drawImage(img, 0, 0, w, h);
                fotoActualBase64 = canvas.toDataURL("image/jpeg", 0.8);

                const prev = document.getElementById("fotoPreview");
                prev.src = fotoActualBase64;
                prev.style.display = "block";
                document.getElementById("fotoStatus").textContent = "✓ Foto lista";
            };
            img.src = e.target.result;
        };
        reader.readAsDataURL(file);
    };

    window.limpiarFormulario = function() {
        document.getElementById("editId").value = "";
        document.getElementById("formTitle").textContent = "➕ Cargar artículo nuevo";
        document.getElementById("btnGuardar").textContent = "💾 Publicar en la tienda CRESO";
        document.getElementById("btnCancelarEdicion").style.display = "none";
        document.getElementById("nombre").value = "";
        document.getElementById("categoria").value = "cables";
        document.getElementById("precioUnitario").value = "";
        document.getElementById("precioMayorista").value = "";
        document.getElementById("badge").value = "";
        document.getElementById("descripcion").value = "";
        document.getElementById("fotoFile").value = "";
        document.getElementById("fotoPreview").style.display = "none";
        document.getElementById("fotoStatus").textContent = "Sin foto seleccionada";
        fotoActualBase64 = "";
    };

    window.editarProducto = function(id) {
        const p = cacheProductos.find(x => String(x.id) === String(id));
        if (!p) return;
        document.getElementById("editId").value = p.id;
        document.getElementById("formTitle").textContent = "✏️ Editando: " + p.nombre;
        document.getElementById("btnGuardar").textContent = "💾 Guardar cambios";
        document.getElementById("btnCancelarEdicion").style.display = "block";
        document.getElementById("nombre").value = p.nombre || "";
        document.getElementById("categoria").value = p.categoria || "cables";
        document.getElementById("precioUnitario").value = p.precio_unitario || "";
        document.getElementById("precioMayorista").value = p.precio_mayorista || "";
        document.getElementById("badge").value = p.badge || "";
        document.getElementById("descripcion").value = p.descripcion || "";
        fotoActualBase64 = p.imagen_url || "";

        const prev = document.getElementById("fotoPreview");
        if (fotoActualBase64) {
            prev.src = fotoActualBase64;
            prev.style.display = "block";
            document.getElementById("fotoStatus").textContent = "Foto actual cargada";
        } else {
            prev.style.display = "none";
            document.getElementById("fotoStatus").textContent = "Sin foto";
        }
        window.scrollTo({ top: 0, behavior: "smooth" });
    };

    window.guardarProducto = async function() {
        const editId = document.getElementById("editId").value.trim();
        const nombre = document.getElementById("nombre").value.trim();
        const categoria = document.getElementById("categoria").value;
        const precio_unitario = parseInt(document.getElementById("precioUnitario").value, 10);
        const precio_mayorista = parseInt(document.getElementById("precioMayorista").value, 10);
        const badge = document.getElementById("badge").value.trim() || "NUEVO";
        const descripcion = document.getElementById("descripcion").value.trim() || "Disponible en CRESO.";

        if (!nombre || isNaN(precio_unitario) || precio_unitario <= 0) {
            document.getElementById("estado").textContent = "⚠️ Completá el nombre y el precio unitario.";
            return;
        }

        const payload = {
            nombre,
            categoria,
            descripcion,
            precio_unitario,
            precio_mayorista: (!isNaN(precio_mayorista) && precio_mayorista > 0) ? precio_mayorista : precio_unitario,
            badge,
            imagen_url: fotoActualBase64
        };

        let res;
        if (editId) {
            res = await supabase.from("creso_productos").update(payload).eq("id", editId);
        } else {
            res = await supabase.from("creso_productos").insert([payload]);
        }

        if (res.error) {
            document.getElementById("estado").textContent = "❌ Error Supabase: " + res.error.message;
            return;
        }

        limpiarFormulario();
        document.getElementById("estado").textContent = editId ? "✅ Artículo actualizado." : "✅ Artículo publicado en CRESO.";
        cargarProductos();
    };

    window.borrarProducto = async function(id) {
        if (!confirm("¿Seguro que querés eliminar este artículo?")) return;
        const { error } = await supabase.from("creso_productos").delete().eq("id", id);
        if (error) {
            document.getElementById("estado").textContent = "❌ Error al borrar: " + error.message;
            return;
        }
        document.getElementById("estado").textContent = "🗑️ Artículo eliminado.";
        cargarProductos();
    };

    async function cargarProductos() {
        const { data, error } = await supabase
            .from("creso_productos")
            .select("*")
            .order("creado_en", { ascending: false });

        const box = document.getElementById("listaProductos");
        if (error) {
            box.innerHTML = `<p style="color:#b91c1c; font-weight:700;">Error al conectar: ${error.message}</p>`;
            return;
        }
        cacheProductos = data || [];
        if (!cacheProductos.length) {
            box.innerHTML = `<p style="color:#475569;">Todavía no cargaste artículos nuevos. Usá el formulario de arriba.</p>`;
            return;
        }

        box.innerHTML = cacheProductos.map(p => `
            <div class="prod-item">
                <img class="prod-thumb" src="${p.imagen_url || ""}" alt="${p.nombre}" onerror="this.style.display='none'">
                <div class="prod-info">
                    <strong>${p.nombre}</strong>
                    <div class="prod-meta">${p.categoria.toUpperCase()} • Unit: $${Number(p.precio_unitario).toLocaleString("es-AR")} • 3+: $${Number(p.precio_mayorista).toLocaleString("es-AR")}</div>
                </div>
                <div class="prod-actions">
                    <button class="btn btn-edit" onclick="editarProducto('${p.id}')">Editar</button>
                    <button class="btn btn-del" onclick="borrarProducto('${p.id}')">Borrar</button>
                </div>
            </div>
        `).join("");
    }

    cargarProductos();
</script>
</body>
</html>
